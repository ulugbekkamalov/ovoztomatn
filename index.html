<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Matn o'quvchi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background: #45a049; }
        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h2>🎙️ Matn o'quvchi</h2>

    <select id="ovoz"></select>
    <textarea id="matn" placeholder="Matn kiriting..."></textarea>
    <br>
    <button onclick="gapir()">▶ O'qib ber</button>
    <button onclick="toxtat()" style="background:#e74c3c;">⏹ To'xtat</button>

    <script>
        // Ovozlarni yuklash
        function ovozlarniYukla() {
            const select = document.getElementById("ovoz");
            const ovozlar = speechSynthesis.getVoices();
            select.innerHTML = "";
            ovozlar.forEach((ovoz, i) => {
                const option = document.createElement("option");
                option.value = i;
                option.textContent = `${ovoz.name} (${ovoz.lang})`;
                select.appendChild(option);
            });
        }

        speechSynthesis.onvoiceschanged = ovozlarniYukla;
        ovozlarniYukla();

        function gapir() {
            const matn = document.getElementById("matn").value;
            const ovozIndex = document.getElementById("ovoz").value;
            const ovozlar = speechSynthesis.getVoices();

            if (!matn.trim()) {
                alert("Matn kiriting!");
                return;
            }

            speechSynthesis.cancel();

            const gap = new SpeechSynthesisUtterance(matn);
            gap.voice = ovozlar[ovozIndex];
            gap.rate = 1;    // tezlik
            gap.pitch = 1;   // ovoz toni
            gap.volume = 1;  // balandlik

            speechSynthesis.speak(gap);
        }

        function toxtat() {
            speechSynthesis.cancel();
        }
    </script>
</body>
</html>
