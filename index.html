<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Ovoz Studiyasi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; color: #222; min-height: 100vh; }
  .wrap { max-width: 700px; margin: 0 auto; padding: 1.2rem 1rem 3rem; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 3px; }
  .sub { font-size: 13px; color: #888; margin-bottom: 1.2rem; }

  /* Tabs */
  .tabs { display: flex; gap: 6px; margin-bottom: 1.2rem; }
  .tab { flex: 1; padding: 10px 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; cursor: pointer; background: transparent; color: #666; transition: all .15s; text-align: center; touch-action: manipulation; }
  .tab.active { background: #fff; color: #111; border-color: #999; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
  .label { font-size: 11px; color: #888; margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }

  /* Input */
  input[type=text], input[type=search] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ddd; background: #fafafa; color: #222; font-size: 15px; margin-bottom: 10px; outline: none; }
  input:focus { border-color: #777; background: #fff; }
  textarea { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ddd; background: #fafafa; color: #222; font-size: 15px; resize: vertical; min-height: 120px; font-family: Arial, sans-serif; outline: none; }
  textarea:focus { border-color: #777; background: #fff; }

  /* Buttons */
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button { padding: 11px 18px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; cursor: pointer; background: #fff; color: #222; font-family: Arial, sans-serif; touch-action: manipulation; transition: all .15s; }
  button:active { transform: scale(0.96); }
  .btn-primary { background: #222; color: #fff; border-color: #222; font-weight: 700; }
  .btn-danger { color: #c0392b; border-color: #e0b0b0; }

  /* Status */
  .status { font-size: 13px; color: #888; margin-top: 8px; min-height: 18px; line-height: 1.5; }
  .status.ok  { color: #27ae60; font-weight: 600; }
  .status.err { color: #c0392b; font-weight: 600; }
  .status.inf { color: #2980b9; }

  /* Lang filter */
  .lang-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .lang-btn { padding: 7px 14px; border-radius: 20px; border: 1px solid #ddd; font-size: 13px; cursor: pointer; background: #f5f5f5; color: #555; touch-action: manipulation; transition: all .15s; }
  .lang-btn.active { background: #222; color: #fff; border-color: #222; font-weight: 600; }

  /* Voice grid */
  .voice-count { font-size: 12px; color: #aaa; margin-bottom: 8px; }
  .voice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 260px; overflow-y: auto; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
  .voice-card { padding: 10px 10px; border-radius: 8px; border: 1px solid #e0e0e0; cursor: pointer; background: #fafafa; touch-action: manipulation; transition: all .15s; }
  .voice-card:active { background: #ececec; }
  .voice-card.selected { border-color: #222; background: #222; color: #fff; }
  .voice-card.selected .vc-lang { color: #aaa; }
  .vc-name { font-size: 12px; font-weight: 600; margin-bottom: 2px; word-break: break-word; }
  .vc-lang { font-size: 11px; color: #888; }
  .vc-gender { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-top: 4px; font-weight: 600; }
  .female { background: #fce8f3; color: #a01a6e; }
  .male   { background: #e8f0fe; color: #1a56a0; }
  .voice-card.selected .female { background: #bf3a8f; color: #fff; }
  .voice-card.selected .male   { background: #3a6abf; color: #fff; }
  .no-voice { font-size: 13px; color: #aaa; padding: 20px; text-align: center; }

  /* Range */
  .range-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .range-row label { font-size: 13px; color: #666; min-width: 65px; }
  .range-row input[type=range] { flex: 1; height: 36px; }
  .range-row span { font-size: 13px; font-weight: 700; min-width: 32px; text-align: right; }

  /* Panel */
  .panel { display: none; }
  .panel.active { display: block; }

  /* STT */
  .mic-area { display: flex; flex-direction: column; align-items: center; padding: 1rem 0; }
  .mic-btn { width: 72px; height: 72px; border-radius: 50%; border: none; font-size: 28px; background: #222; color: #fff; display: flex; align-items: center; justify-content: center; touch-action: manipulation; cursor: pointer; transition: all .2s; }
  .mic-btn:active { transform: scale(0.93); }
  .mic-btn.rec { background: #e74c3c; animation: mpulse 1.2s infinite; }
  @keyframes mpulse { 0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,.4)} 50%{box-shadow:0 0 0 14px rgba(231,76,60,0)} }
  .mic-hint { margin-top: 8px; font-size: 12px; color: #888; text-align: center; }
  .rec-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #e74c3c; margin-right: 5px; animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

  /* STT lang */
  .stt-lang-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .stt-lang-btn { padding: 7px 14px; border-radius: 20px; border: 1px solid #ddd; font-size: 13px; cursor: pointer; background: #f5f5f5; color: #555; touch-action: manipulation; transition: all .15s; }
  .stt-lang-btn.active { background: #222; color: #fff; border-color: #222; font-weight: 600; }

  /* Result */
  .result-box { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; font-size: 15px; color: #222; min-height: 60px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; margin-top: 10px; display: none; }

  /* Gender */
  .gender-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .gender-btn { flex: 1; padding: 11px 8px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; cursor: pointer; background: #fafafa; touch-action: manipulation; text-align: center; transition: all .15s; }
  .gender-btn.f-active { background: #fce8f3; border-color: #d063a0; color: #a01a6e; font-weight: 700; }
  .gender-btn.m-active { background: #e8f0fe; border-color: #4a7fd4; color: #1a56a0; font-weight: 700; }

  .tts-send-card { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 10px; padding: 14px; margin-top: 12px; display: none; }
  .sel-voice-info { font-size: 13px; color: #444; margin-top: 8px; min-height: 18px; }
  .sel-voice-info b { font-weight: 700; }

  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #eee; }
    .card { background: #252525; border-color: #333; }
    .tab { color: #aaa; border-color: #444; }
    .tab.active { background: #333; color: #eee; border-color: #666; box-shadow: none; }
    input, textarea, .result-box { background: #2a2a2a !important; color: #eee !important; border-color: #444 !important; }
    button { background: #2a2a2a; color: #eee; border-color: #444; }
    .btn-primary { background: #eee; color: #111; border-color: #eee; }
    .lang-btn, .stt-lang-btn { background: #2a2a2a; color: #ccc; border-color: #444; }
    .lang-btn.active, .stt-lang-btn.active { background: #eee; color: #111; border-color: #eee; }
    .voice-card { background: #2a2a2a; border-color: #444; color: #eee; }
    .voice-card.selected { background: #eee; color: #111; border-color: #eee; }
    .voice-card.selected .vc-lang { color: #555; }
    .vc-lang { color: #888; }
    .gender-btn { background: #2a2a2a; color: #eee; border-color: #444; }
    .tts-send-card { background: #2a2a2a; border-color: #444; }
    .mic-btn { background: #eee; color: #111; }
    .mic-btn.rec { background: #e74c3c; color: #fff; }
  }

  @media (max-width: 420px) {
    .voice-grid { grid-template-columns: 1fr; }
    .tabs { gap: 4px; }
    .tab { font-size: 13px; padding: 9px 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ Ovoz Studiyasi</h1>
  <p class="sub">Matnni ovozga va ovozni matnga o'giruvchi dastur</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('tts')">Matn → Ovoz</button>
    <button class="tab" onclick="switchTab('stt')">Ovoz → Matn</button>
  </div>

  <!-- ===== TTS ===== -->
  <div id="tts" class="panel active">
    <div class="card">
      <div class="label">Til filtri</div>
      <div class="lang-btns">
        <button class="lang-btn active" onclick="filterLang('all',this)">Barchasi</button>
        <button class="lang-btn" onclick="filterLang('uz',this)">O'zbek</button>
        <button class="lang-btn" onclick="filterLang('ru',this)">Rus</button>
        <button class="lang-btn" onclick="filterLang('en',this)">Ingliz</button>
      </div>
      <div class="label">Ovoz qidirish</div>
      <input type="search" id="search" placeholder="Ovoz nomi yoki til (uz-UZ, en-US, ru-RU...)" oninput="renderFiltered()" autocomplete="off">
      <div class="voice-count" id="vcount">Yuklanmoqda...</div>
      <div class="voice-grid" id="voiceGrid"></div>
    </div>

    <div class="card">
      <div class="label">Sozlamalar</div>
      <div class="range-row">
        <label>Tezlik</label>
        <input type="range" min="0.5" max="2" step="0.1" value="1" id="rate"
          oninput="rateVal.textContent=parseFloat(this.value).toFixed(1)">
        <span id="rateVal">1.0</span>
      </div>
      <div class="range-row">
        <label>Ton</label>
        <input type="range" min="0" max="2" step="0.1" value="1" id="pitch"
          oninput="pitchVal.textContent=parseFloat(this.value).toFixed(1)">
        <span id="pitchVal">1.0</span>
      </div>
    </div>

    <div class="card">
      <div class="label">Matn</div>
      <textarea id="ttsText" placeholder="Bu yerga matn kiriting..."></textarea>
      <div class="btn-row">
        <button class="btn-primary" onclick="speak()">▶ O'qib ber</button>
        <button class="btn-danger" onclick="stopSpeak()">⏹ To'xtat</button>
        <button onclick="clearTTS()">Tozala</button>
      </div>
      <div class="status" id="ttsStatus"></div>
    </div>
  </div>

  <!-- ===== STT ===== -->
  <div id="stt" class="panel">
    <div class="card">
      <div class="label">Nutq tili</div>
      <div class="stt-lang-row" id="sttLangRow">
        <button class="stt-lang-btn active" data-lang="uz-UZ">🇺🇿 O'zbek</button>
        <button class="stt-lang-btn" data-lang="ru-RU">🇷🇺 Rus</button>
        <button class="stt-lang-btn" data-lang="en-US">🇺🇸 Ingliz</button>
        <button class="stt-lang-btn" data-lang="tr-TR">🇹🇷 Turk</button>
        <button class="stt-lang-btn" data-lang="ar-SA">🇸🇦 Arab</button>
        <button class="stt-lang-btn" data-lang="de-DE">🇩🇪 Nemis</button>
      </div>

      <div class="label">Mikrofon</div>
      <div class="mic-area">
        <button class="mic-btn" id="micBtn" onclick="toggleRec()">🎤</button>
        <div class="mic-hint" id="micHint">Bosing va gapiring</div>
      </div>

      <div class="label" style="margin-top:4px">Natija</div>
      <div class="result-box" id="resultBox"></div>

      <div class="btn-row" id="copyRow" style="display:none;margin-top:10px">
        <button onclick="copyText()">Nusxa</button>
        <button onclick="showSend()">🔊 O'qib ber</button>
        <button onclick="clearSTT()">Tozala</button>
      </div>
      <div class="status" id="sttStatus"></div>

      <!-- Ovoz tanlash panel -->
      <div class="tts-send-card" id="sendCard">
        <div class="label" style="margin-bottom:10px">Ovoz tanlang</div>

        <div class="label">Jins</div>
        <div class="gender-row">
          <button class="gender-btn" id="femBtn" onclick="pickGender('female')">👩 Ayol</button>
          <button class="gender-btn" id="malBtn" onclick="pickGender('male')">👨 Erkak</button>
        </div>

        <div class="label">Til</div>
        <div class="lang-btns" id="sendLangBtns">
          <button class="lang-btn active" onclick="pickSendLang('uz',this)">O'zbek</button>
          <button class="lang-btn" onclick="pickSendLang('ru',this)">Rus</button>
          <button class="lang-btn" onclick="pickSendLang('en',this)">Ingliz</button>
        </div>

        <div class="sel-voice-info" id="selVoiceInfo">Jins va til tanlang</div>

        <div class="btn-row" style="margin-top:10px">
          <button class="btn-primary" onclick="speakSTT()">▶ O'qib ber</button>
          <button onclick="sendToTTS()">TTS ga yuborish</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== TTS ====================
let allVoices = [];
let selectedVoice = null;
let curLangFilter = 'all';

const GENDER_KW = {
  female: ['female','woman','girl','zira','hazel','susan','linda','emma','aria','jenny',
           'sonia','elsa','anna','natasha','svetlana','dariya','irina','madina','nova','shimmer'],
  male:   ['male','man','guy','david','mark','james','ryan','liam','eric','roger',
           'william','dmitry','alexey','sardor','onyx','echo','fable']
};

function guessGender(v) {
  const n = v.name.toLowerCase();
  for (const k of GENDER_KW.female) if (n.includes(k)) return 'female';
  for (const k of GENDER_KW.male)   if (n.includes(k)) return 'male';
  return 'unknown';
}

function loadVoices() {
  const v = speechSynthesis.getVoices();
  if (!v.length) return;
  allVoices = v;
  renderFiltered();
}

function getFiltered() {
  const q = (document.getElementById('search').value || '').toLowerCase().trim();
  return allVoices.filter(v => {
    const lang = v.lang.toLowerCase(), name = v.name.toLowerCase();
    const lm = curLangFilter === 'all' ? true :
               curLangFilter === 'uz'  ? lang.startsWith('uz') :
               curLangFilter === 'ru'  ? lang.startsWith('ru') :
               curLangFilter === 'en'  ? lang.startsWith('en') : true;
    return lm && (!q || name.includes(q) || lang.includes(q));
  });
}

function renderFiltered() {
  const list = getFiltered();
  document.getElementById('vcount').textContent = list.length + ' ta ovoz';
  if (!list.length) {
    document.getElementById('voiceGrid').innerHTML = '<div class="no-voice">Ovoz topilmadi</div>';
    return;
  }
  document.getElementById('voiceGrid').innerHTML = list.map(v => {
    const g = guessGender(v);
    const gl = g === 'female' ? '<span class="vc-gender female">Ayol</span>'
             : g === 'male'   ? '<span class="vc-gender male">Erkak</span>' : '';
    const sel = selectedVoice && v.name === selectedVoice.name;
    const idx = allVoices.indexOf(v);
    return `<div class="voice-card${sel?' selected':''}" onclick="selectVoice(${idx},this)">
      <div class="vc-name">${v.name}</div>
      <div class="vc-lang">${v.lang}</div>${gl}</div>`;
  }).join('');
}

function selectVoice(idx, el) {
  selectedVoice = allVoices[idx];
  document.querySelectorAll('.voice-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}

function filterLang(lang, btn) {
  curLangFilter = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderFiltered();
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();
setTimeout(loadVoices, 500); // iOS uchun

function speak() {
  const text = document.getElementById('ttsText').value.trim();
  if (!text) { st('ttsStatus','Matn kiriting!','err'); return; }
  if (!selectedVoice) selectedVoice = getFiltered()[0] || allVoices[0];
  if (!selectedVoice) { st('ttsStatus','Ovoz tanlanmadi!','err'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = selectedVoice;
  u.rate  = parseFloat(document.getElementById('rate').value);
  u.pitch = parseFloat(document.getElementById('pitch').value);
  u.onstart = () => st('ttsStatus', 'O\'qilmoqda: ' + selectedVoice.name, '');
  u.onend   = () => st('ttsStatus', 'Tugadi!', 'ok');
  u.onerror = () => st('ttsStatus', 'Xatolik', 'err');
  speechSynthesis.speak(u);

  // iOS bug fix — uzun matnda to'xtab qoladi
  iosKeepAlive(u);
}

function iosKeepAlive(utt) {
  // iOS Safari da synthesizer 15s dan keyin to'xtab qoladi
  const timer = setInterval(() => {
    if (!speechSynthesis.speaking) { clearInterval(timer); return; }
    speechSynthesis.pause();
    speechSynthesis.resume();
  }, 10000);
  utt.onend = utt.onerror = () => {
    clearInterval(timer);
    st('ttsStatus', 'Tugadi!', 'ok');
  };
}

function stopSpeak() { speechSynthesis.cancel(); st('ttsStatus','To\'xtatildi',''); }
function clearTTS()  { document.getElementById('ttsText').value=''; st('ttsStatus','',''); }

// ==================== STT ====================
let recognition = null;
let isRecording = false;
let finalText = '';
let sttLang = 'uz-UZ';
let sttGender = null;
let sendLang = 'uz';

// Nutq tili tugmalari
document.getElementById('sttLangRow').addEventListener('click', e => {
  const btn = e.target.closest('.stt-lang-btn');
  if (!btn) return;
  sttLang = btn.dataset.lang;
  document.querySelectorAll('.stt-lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
});

function toggleRec() {
  if (isRecording) stopRec();
  else startRec();
}

function startRec() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    st('sttStatus', 'Chrome brauzer kerak. Telegram brauzerida ishlamaydi.', 'err');
    return;
  }

  // Eski recognition ni to'xtat
  if (recognition) { try { recognition.abort(); } catch(e){} }

  finalText = '';
  document.getElementById('resultBox').textContent = '';

  recognition = new SR();
  recognition.lang = sttLang;
  recognition.continuous = false;      // FALSE — takrorlanishni oldini oladi
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('micBtn').classList.add('rec');
    document.getElementById('micBtn').textContent = '⏹';
    document.getElementById('micHint').innerHTML = '<span class="rec-dot"></span>Yozilmoqda...';
    st('sttStatus','','');
  };

  recognition.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        finalText += e.results[i][0].transcript + ' ';
      } else {
        interim = e.results[i][0].transcript;
      }
    }
    showResult((finalText + interim).trim());
  };

  recognition.onerror = e => {
    if (e.error === 'no-speech') {
      // Jim qolindi — qayta boshlash
      if (isRecording) setTimeout(() => { try { recognition.start(); } catch(er){} }, 300);
      return;
    }
    if (e.error === 'aborted') return;
    st('sttStatus', 'Xatolik: ' + e.error, 'err');
    stopRecUI();
  };

  recognition.onend = () => {
    // Yozilayotgan bo'lsa — qayta boshlash
    if (isRecording) {
      setTimeout(() => {
        try { recognition.start(); } catch(er) { stopRecUI(); }
      }, 250);
    }
  };

  try { recognition.start(); } catch(e) {
    st('sttStatus', 'Mikrofon ishga tushmadi: ' + e.message, 'err');
  }
}

function stopRec() {
  isRecording = false;
  if (recognition) { try { recognition.stop(); } catch(e){} }
  stopRecUI();
  if (finalText.trim()) {
    document.getElementById('copyRow').style.display = 'flex';
    st('sttStatus', 'Yozib olindi!', 'ok');
  }
}

function stopRecUI() {
  isRecording = false;
  const btn = document.getElementById('micBtn');
  btn.classList.remove('rec');
  btn.textContent = '🎤';
  document.getElementById('micHint').textContent = 'Bosing va gapiring';
}

function showResult(text) {
  const box = document.getElementById('resultBox');
  box.style.display = 'block';
  box.textContent = text;
}

function copyText() {
  const text = finalText.trim();
  if (!text) return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => st('sttStatus','Nusxa olindi!','ok'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    st('sttStatus','Nusxa olindi!','ok');
  }
}

function clearSTT() {
  finalText = '';
  const box = document.getElementById('resultBox');
  box.style.display = 'none'; box.textContent = '';
  document.getElementById('copyRow').style.display = 'none';
  document.getElementById('sendCard').style.display = 'none';
  st('sttStatus','','');
}

// --- Ovozga o'girish panel ---
function showSend() {
  const c = document.getElementById('sendCard');
  c.style.display = c.style.display === 'block' ? 'none' : 'block';
}

function pickGender(g) {
  sttGender = g;
  document.getElementById('femBtn').className = 'gender-btn' + (g==='female'?' f-active':'');
  document.getElementById('malBtn').className = 'gender-btn' + (g==='male'?' m-active':'');
  updateSelInfo();
}

function pickSendLang(lang, btn) {
  sendLang = lang;
  document.querySelectorAll('#sendLangBtns .lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateSelInfo();
}

function findSendVoice() {
  if (!sttGender) return null;
  return allVoices.find(v =>
    v.lang.toLowerCase().startsWith(sendLang) && guessGender(v) === sttGender
  ) || null;
}

function updateSelInfo() {
  const el = document.getElementById('selVoiceInfo');
  if (!sttGender) { el.innerHTML = 'Jins tanlang'; return; }
  const v = findSendVoice();
  if (v) el.innerHTML = `${sttGender==='female'?'👩':'👨'} <b>${v.name}</b> (${v.lang})`;
  else   el.innerHTML = '<span style="color:#c0392b">Bu til uchun ovoz topilmadi</span>';
}

function speakSTT() {
  const text = finalText.trim();
  if (!text) { st('sttStatus','Matn yo\'q!','err'); return; }
  const v = findSendVoice();
  if (!v) { st('sttStatus','Ovoz topilmadi!','err'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = v; u.rate = 1; u.pitch = 1;
  u.onstart = () => st('sttStatus','O\'qilmoqda: '+v.name,'inf');
  u.onend   = () => st('sttStatus','Tugadi!','ok');
  iosKeepAlive(u);
  speechSynthesis.speak(u);
}

function sendToTTS() {
  document.getElementById('ttsText').value = finalText.trim();
  const v = findSendVoice();
  if (v) selectedVoice = v;
  switchTab('tts');
}

// --- Umumiy ---
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) =>
    t.classList.toggle('active', ['tts','stt'][i] === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(name).classList.add('active');
}

function st(id, msg, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = msg;
  el.className = 'status' + (type ? ' '+type : '');
}

// iOS: sahifa yashirilganda to'xtatish
document.addEventListener('visibilitychange', () => {
  if (document.hidden && isRecording) stopRec();
});
</script>
